<script>
/* =====================================================
   1) MEMÓRIA — tudo é salvo no navegador (localStorage)
   ===================================================== */
const KEY = "sistema-logistica-v2";
const DAY = 864e5;

function seed() {
  const now = Date.now();
  const P = (id, name, sku, category, stock, min, unit, cost, sales, active = true) => ({ id, name, sku, category, stock, min, unit, cost, sales, active });
  const products = [
    P("p1", "Café em grãos 500g", "CAF-500-01", "Alimentos", 124, 40, "un.", 32.9, 82),
    P("p2", "Água mineral 500ml", "AGM-500-04", "Bebidas", 18, 30, "fardos", 14.5, 146),
    P("p3", "Papel toalha interfolhado", "HIG-PT-02", "Higiene", 52, 20, "cx.", 89, 64),
    P("p4", "Detergente neutro 500ml", "LIM-DT-05", "Limpeza", 0, 12, "un.", 2.8, 31, false),
    P("p5", "Luva nitrílica M", "EPI-LUV-03", "EPI", 86, 35, "cx.", 36, 29),
    P("p6", "Copo descartável 200ml", "COP-200-08", "Descartáveis", 11, 25, "pct.", 7.9, 118)
  ];
  const movements = []; let n = 1000;
  const names = ["Marina Costa", "Rafael Lima", "João Pedro"];
  for (let d = 6; d >= 0; d--) {
    [["p2", "Entrada", 12 + d * 3], ["p1", "Saída", 6 + (d % 3) * 5], ["p6", "Saída", 9 + (d % 4) * 3], ["p3", "Entrada", 10 + (d % 2) * 8], ["p5", "Saída", 4 + d]].forEach(([pid, type, q], i) => {
      movements.push({ id: "MOV-" + (++n), pid, product: products.find(p => p.id === pid).name, type, quantity: q, ts: now - d * DAY - (i + 1) * 36e5, responsible: names[(d + i) % 3], status: "Confirmada" });
    });
  }
  movements.reverse();
  const purchases = [
    { id: "PC-2001", pid: "p2", product: "Água mineral 500ml", supplier: "Distribuidora Nova Era", qty: 30, status: "A caminho", created: now - 2 * DAY, eta: now + 2 * DAY },
    { id: "PC-2002", pid: "p6", product: "Copo descartável 200ml", supplier: "Atacadão do Brasil", qty: 50, status: "Recebido", created: now - 5 * DAY, eta: now - DAY },
    { id: "PC-2003", pid: "p4", product: "Detergente neutro 500ml", supplier: "Limpa Fácil Ltda.", qty: 24, status: "Aguardando", created: now - DAY, eta: now + 4 * DAY }
  ];
  return { users: [{ name: "Marina Costa", email: "marina@empresa.com", pass: "123456" }], session: null, products, movements, purchases, n: { mov: n, po: 2003 } };
}

let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
if (!db) db = seed();
/* Tema: "light", "dark" ou automático (segue o sistema operacional) */

}
function setTheme(v) { db.theme = v === "auto" ? null : v; save(); applyTheme(); render(); toast("Aparência atualizada"); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* navegador bloqueou o armazenamento */ } };

  const d = new Date(ts), h = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

function modal(html, wide) {
  closeModal();
  root.insertAdjacentHTML("beforeend", `<div class="modal-backdrop" onmousedown="if(event.target===this)closeModal()"><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true"><button class="modal-close" aria-label="Fechar" onclick="closeModal()">${ic("x")}</button>${html}</div></div>`);

function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = ic("check", 16) + esc(msg); document.body.append(t); setTimeout(() => t.remove(), 2800); }
const setErr = m => { const e = $("err"); if (e) e.textContent = m; return false; };

function exportCSV(name, rows) {
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = name + ".csv"; a.click(); toast("Arquivo " + name + ".csv exportado");
}

function doAuth(e) {
  e.preventDefault();
  const email = val("email").toLowerCase(), pass = $("senha").value;
  if (ui.reg) {
    const name = val("nome");
    if (!name) return setErr("Informe seu nome.");
    if (!/^\S+@\S+\.\S+$/.test(email)) return setErr("Informe um e-mail válido.");
    if (pass.length < 6) return setErr("A senha precisa ter pelo menos 6 caracteres.");
    if (pass !== $("senha2").value) return setErr("As senhas não conferem.");
    if (db.users.some(u => u.email === email)) return setErr("Este e-mail já está cadastrado.");
    db.users.push({ name, email, pass });
  } else if (!db.users.some(u => u.email === email && u.pass === pass)) return setErr("E-mail ou senha incorretos.");
  db.session = email; ui.reg = false; ui.page = "Visão geral"; save(); viewApp();
}
function logout() { db.session = null; save(); viewLogin(); }

function dashboard() {

  const path = k => days.map((d, i) => `${i ? "L" : "M"}${i * 100},${200 - (d[k] / top) * 180}`).join(" ");
  const ranking = [...db.products].sort((a, b) => b.sales - a.sales).slice(0, 4), maxS = Math.max(1, ranking[0] ? ranking[0].sales : 0);

    ${kpi("Saídas hoje", outToday, today.length + " movimentações", "down", "blue")}
    ${kpi("Pedidos em trânsito", String(transit.length).padStart(2, "0"), next ? "Próxima chegada: " + fmtDay(next) : "Nenhum a caminho", "truck", "violet")}

      <div class="chart">
        <div class="chart-y">${[1, .75, .5, .25, 0].map(f => `<span>${Math.round(top * f)}</span>`).join("")}</div>
        <div class="chart-area">
          <div class="grid-lines"><i></i><i></i><i></i><i></i><i></i></div>
          <svg viewBox="0 0 600 220" preserveAspectRatio="none" class="line-chart"><path d="${path("in")}" fill="none" stroke="#20bcae" stroke-width="3" stroke-linejoin="round"/><path d="${path("out")}" fill="none" stroke="#9a87e8" stroke-width="3" stroke-dasharray="6 5" stroke-linejoin="round"/></svg>

/* =====================================================
   6) MOVIMENTAÇÕES
   ===================================================== */
function applyMove(p, type, q, note) {
  let qty = q;
  if (type === "Entrada") p.stock += q;
  else if (type === "Saída") { p.stock -= q; p.sales += q; }
  else { qty = Math.abs(q - p.stock); p.stock = q; }
  db.movements.unshift({ id: "MOV-" + (++db.n.mov), pid: p.id, product: p.name, type, quantity: qty, ts: Date.now(), responsible: user().name, status: "Confirmada", note: note || "" });
}

function openMov(type = "Saída", pid = "") {
  const opts = db.products.filter(p => p.active).map(p => `<option value="${p.id}" ${p.id === pid ? "selected" : ""}>${esc(p.name)} · ${p.stock} ${p.unit}</option>`).join("");
  modal(`<span class="eyebrow">NOVA MOVIMENTAÇÃO</span><h2>Registrar movimentação</h2>
  <p class="modal-sub">Cada confirmação cria um único evento no histórico.</p>
  <form onsubmit="saveMov(event)">
    <label>Tipo<select id="mtype" onchange="$('qlabel').firstChild.textContent=this.value==='Ajuste'?'Quantidade contada (novo estoque)':'Quantidade'">${["Entrada", "Saída", "Ajuste"].map(t => `<option ${t === type ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <label>Produto<select id="mprod">${opts}</select></label>
    <label id="qlabel">Quantidade<input id="mqty" type="number" min="0" value="1"></label>
    <label>Observação (opcional)<input id="mnote" placeholder="Ex.: nota fiscal 1234"></label>
    <div class="err" id="err" role="alert"></div>
    <button class="primary full" id="mbtn" type="submit" style="margin-top:10px">Confirmar ${ic("check", 16)}</button>
  </form>`);
  if (type === "Ajuste") $("qlabel").firstChild.textContent = "Quantidade contada (novo estoque)";
}

function saveMov(e) {
  e.preventDefault();
  const p = db.products.find(x => x.id === $("mprod").value), type = $("mtype").value, q = Number($("mqty").value);
  if (!p) return setErr("Selecione um produto.");
  if (!Number.isInteger(q) || q < 0 || (type !== "Ajuste" && q < 1)) return setErr("Informe uma quantidade válida.");
  if (type === "Saída" && q > p.stock) return setErr(`Estoque insuficiente: só há ${p.stock} ${p.unit}.`);
  $("mbtn").disabled = true;
  applyMove(p, type, q, val("mnote")); save(); render(); toast(`${type} registrada: ${p.name}`);
}

function saveProduct(e, id) {
  e.preventDefault();
  const name = val("pn"), min = Number(val("pm")), cost = Number(val("pk") || 0), stock = id ? 0 : Number(val("pi"));
  if (!name) return setErr("Informe o nome do produto.");
  if (db.products.some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())) return setErr("Já existe um produto com esse nome.");
  if ([min, cost, stock].some(n => isNaN(n) || n < 0)) return setErr("Use apenas números positivos nos campos numéricos.");
  const data = { name, category: val("pc") || "Geral", unit: val("pu") || "un.", min, cost };
  if (id) { Object.assign(db.products.find(x => x.id === id), data, { sku: val("ps") || db.products.find(x => x.id === id).sku, active: $("pa").checked }); }
  else {
    const sku = val("ps") || (name.replace(/[^a-z0-9]/gi, "").slice(0, 3).toUpperCase().padEnd(3, "X") + "-" + String(db.products.length + 1).padStart(3, "0"));
    const p = { id: "p" + Date.now(), sku, stock: 0, sales: 0, active: true, ...data };
    db.products.unshift(p); if (stock > 0) applyMove(p, "Entrada", stock, "Estoque inicial");
  }
  save(); render(); toast(id ? "Produto atualizado" : "Produto cadastrado");
}

function delProduct(id) {
  const p = db.products.find(x => x.id === id);
  if (db.movements.some(m => m.pid === id) || db.purchases.some(c => c.pid === id)) {
    if (!p.active) return toast("Este produto já está inativo e tem histórico.");
    if (confirm(`"${p.name}" tem histórico e não pode ser excluído. Deseja inativá-lo?`)) { p.active = false; save(); render(); toast("Produto inativado"); }
  } else if (confirm(`Excluir "${p.name}" definitivamente?`)) { db.products = db.products.filter(x => x.id !== id); save(); render(); toast("Produto excluído"); }
}

/* =====================================================
   8) COMPRAS (criar, avançar status, cancelar)
   ===================================================== */
const NEXT = { "Aguardando": ["Marcar como enviado", "truck"], "A caminho": ["Confirmar recebimento", "check"] };
const TONE = { "Aguardando": "wait", "A caminho": "route", "Recebido": "done" };

function openPurchase(pid = "", qty = 10) {
  const opts = db.products.filter(p => p.active).map(p => `<option value="${p.id}" ${p.id === pid ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  modal(`<span class="eyebrow">NOVA COMPRA</span><h2>Criar pedido de compra</h2><p class="modal-sub">Ao confirmar o recebimento, a entrada no estoque é registrada automaticamente.</p>
  <form onsubmit="savePurchase(event)">
    <label>Produto<select id="cp">${opts}</select></label>
    <label>Fornecedor<input id="cs" placeholder="Ex.: Distribuidora Nova Era"></label>
    <div class="form-grid"><label>Quantidade<input id="cq" type="number" min="1" value="${qty}"></label><label>Entrega prevista<input id="ce" type="date" value="${new Date(Date.now() + 3 * DAY).toISOString().slice(0, 10)}"></label></div>
    <div class="err" id="err" role="alert"></div><button class="primary full" type="submit" style="margin-top:10px">Criar compra ${ic("cart", 16)}</button>
  </form>`);
}

function newPO(p, supplier, qty, eta) {
  db.purchases.unshift({ id: "PC-" + (++db.n.po), pid: p.id, product: p.name, supplier, qty, status: "Aguardando", created: Date.now(), eta });
}
function savePurchase(e) {
  e.preventDefault();
  const p = db.products.find(x => x.id === $("cp").value), qty = Number($("cq").value), eta = new Date($("ce").value + "T12:00:00").getTime();
  if (!p) return setErr("Selecione um produto.");
  if (!val("cs")) return setErr("Informe o fornecedor.");
  if (!Number.isInteger(qty) || qty < 1) return setErr("Informe uma quantidade válida.");
  if (isNaN(eta)) return setErr("Informe a data de entrega prevista.");
  newPO(p, val("cs"), qty, eta); save(); ui.cf = ""; go("Compras"); toast("Compra criada");
}
function advancePO(id) {
  const c = db.purchases.find(x => x.id === id);
  if (c.status === "Aguardando") c.status = "A caminho";
  else if (c.status === "A caminho") {
    c.status = "Recebido"; c.received = Date.now();
    const p = db.products.find(x => x.id === c.pid); if (p) applyMove(p, "Entrada", c.qty, "Compra " + c.id);
  }
  save(); render(); toast(`${c.id}: ${c.status}`);
}
function cancelPO(id) { if (confirm("Cancelar este pedido de compra?")) { db.purchases = db.purchases.filter(x => x.id !== id); save(); render(); toast("Compra cancelada"); } }

function purchasesPage() {
  const list = db.purchases.filter(c => !ui.cf || c.status === ui.cf);
  return `${heading("PEDIDOS E ENTREGAS", "Compras", "Acompanhe o que foi comprado e quando chega ao estoque.", `<button class="primary" onclick="openPurchase()">${ic("plus", 17)} Nova compra</button>`)}
  <div class="chips">${["", "Aguardando", "A caminho", "Recebido"].map(s => `<button class="chip ${ui.cf === s ? "on" : ""}" onclick="ui.cf='${s}';render()">${s || "Todas"} (${s ? db.purchases.filter(c => c.status === s).length : db.purchases.length})</button>`).join("")}</div>
  ${list.length ? `<div class="purchase-grid">${list.map(c => `<div class="card purchase-card"><div class="purchase-icon ${TONE[c.status]}">${ic(c.status === "Recebido" ? "check" : c.status === "A caminho" ? "truck" : "clock", 20)}</div><div class="purchase-status">${badge(c.status)}</div>
    <h3>${esc(c.product)}</h3><p>${esc(c.supplier)} · ${c.id}</p>
    <div class="purchase-meta"><span>${ic("box", 15)} ${c.qty} un.</span><span>${ic("clock", 15)} ${c.status === "Recebido" ? "Recebido: " + fmtDay(c.received || c.eta) : "Entrega: " + fmtDay(c.eta)}</span></div>
    ${NEXT[c.status] ? `<div class="purchase-actions"><button class="primary" onclick="advancePO('${c.id}')">${NEXT[c.status][0]}</button><button class="ghost" title="Cancelar" aria-label="Cancelar compra" onclick="cancelPO('${c.id}')" style="flex:0 0 auto">${ic("trash", 16)}</button></div>` : ""}</div>`).join("")}</div>` : `<div class="card empty">Nenhuma compra neste filtro.</div>`}
  <div class="card status-guide"><div class="card-head"><div><h3>Visão rápida de status</h3><p>O que cada etapa significa no seu fluxo.</p></div></div><div class="guide-row">
    <span class="guide-dot wait"></span><div><strong>Aguardando</strong><span>Compra criada, aguardando fornecedor.</span></div><span class="guide-arrow">→</span>
    <span class="guide-dot route"></span><div><strong>A caminho</strong><span>Pedido confirmado com entrega prevista.</span></div><span class="guide-arrow">→</span>
    <span class="guide-dot done"></span><div><strong>Recebido</strong><span>Entrada conferida e somada ao estoque.</span></div></div></div>`;
}

/* =====================================================
   9) REPOSIÇÃO (sugestões calculadas automaticamente)
   ===================================================== */
const suggest = p => Math.max(p.min * 2 - p.stock, p.min);
function createAllSuggested() {
  const todo = lowItems().filter(p => !openPO(p.id));
  if (!todo.length) return toast("Não há itens novos para comprar.");
  todo.forEach(p => newPO(p, "A definir", suggest(p), Date.now() + 5 * DAY));
  save(); go("Compras"); toast(todo.length + " compra(s) criada(s)");
}
function replenishPage() {
  const low = lowItems(), est = low.filter(p => !openPO(p.id)).reduce((s, p) => s + suggest(p) * p.cost, 0);
  return `${heading("PLANEJAMENTO DE COMPRAS", "Reposição necessária", "Itens que precisam de atenção antes de comprometer a operação.", low.length ? `<button class="primary" onclick="createAllSuggested()">${ic("cart", 17)} Criar todas as sugeridas</button>` : "")}
  <div class="replenish-stats"><div><strong>${String(low.length).padStart(2, "0")}</strong><span>itens abaixo do mínimo</span></div><div><strong>${db.purchases.filter(c => c.status !== "Recebido").length}</strong><span>compras em aberto</span></div><div><strong>${money(est)}</strong><span>estimativa desta rodada</span></div></div>
  ${low.length ? `<div class="purchase-grid">${low.map(p => `<div class="card purchase-card"><div class="purchase-icon wait">${ic("warn", 20)}</div><div class="purchase-status">${openPO(p.id) ? badge("A caminho").replace("A caminho", "Compra aberta") : badge("Atenção")}</div>
    <h3>${esc(p.name)}</h3><p>Atual: ${p.stock} ${p.unit} · Mínimo: ${p.min} ${p.unit}</p>
    <div class="purchase-meta"><span>${ic("box", 15)} Sugestão: ${suggest(p)} ${p.unit}</span><span>${ic("cart", 15)} ${money(suggest(p) * p.cost)}</span></div>
    <button class="primary full" onclick="openPurchase('${p.id}',${suggest(p)})">Criar compra ${ic("cart", 16)}</button></div>`).join("")}</div>` : `<div class="card empty">Tudo certo! Nenhum produto está abaixo do estoque mínimo.</div>`}`;
}

/* =====================================================
   10) EQUIPE e CONFIGURAÇÕES
   ===================================================== */
function teamPage() {
  return `${heading("PESSOAS", "Equipe", "Usuários com acesso a este ambiente.")}
  <div class="card table-card"><div class="table-scroll"><table><thead><tr><th>Nome</th><th>E-mail</th><th></th></tr></thead><tbody>${db.users.map(u => `<tr><td><div class="responsible"><div class="avatar-small">${esc(u.name.split(" ").map(n => n[0]).slice(0, 2).join(""))}</div><strong>${esc(u.name)}</strong></div></td><td class="muted-code">${esc(u.email)}</td><td>${u.email === db.session ? badge("Ativo").replace("Ativo", "Você") : ""}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function settingsPage() {
  return `${heading("PREFERÊNCIAS", "Configurações", "Seu perfil e os dados guardados neste navegador.")}
  <div class="card" style="max-width:520px;margin-bottom:18px"><h3>Perfil</h3><form onsubmit="saveName(event)" class="auth-form" style="max-width:none"><label>Nome<input id="un" value="${esc(user().name)}"></label><div class="err" id="err"></div><button class="primary" type="submit">Salvar nome</button></form></div>
  <div class="card" style="max-width:520px;margin-bottom:18px"><h3>Aparência</h3><p style="color:var(--muted);line-height:1.6">Escolha o tema da interface. No modo automático, o sistema segue o seu computador ou celular.</p>
    <div class="chips" style="margin:0">${[["light", "☀ Claro"], ["dark", "☾ Escuro"], ["auto", "Automático"]].map(([v, l]) => `<button class="chip ${(db.theme || "auto") === v ? "on" : ""}" onclick="setTheme('${v}')">${l}</button>`).join("")}</div></div>
  <div class="card" style="max-width:520px"><h3>Dados do sistema</h3><p style="color:var(--muted);line-height:1.6">Tudo o que você faz fica salvo neste navegador. Limpar os dados do navegador apaga essas informações.</p>
    <div class="heading-actions" style="flex-wrap:wrap"><button class="ghost" onclick="resetData()">Restaurar dados de exemplo</button><button class="ghost" onclick="wipeData()" style="color:var(--red)">${ic("trash", 16)} Apagar tudo</button></div></div>`;
}
function saveName(e) { e.preventDefault(); if (!val("un")) return setErr("Informe um nome."); user().name = val("un"); save(); render(); toast("Perfil atualizado"); }
function resetData() { if (confirm("Voltar aos produtos, movimentações e compras de exemplo? Seus usuários serão mantidos.")) { const s = seed(); db = { ...s, users: db.users, session: db.session, theme: db.theme }; save(); go("Visão geral"); toast("Dados de exemplo restaurados"); } }
function wipeData() { if (confirm("Apagar TODOS os produtos, movimentações e compras?")) { db.products = []; db.movements = []; db.purchases = []; save(); go("Visão geral"); toast("Dados apagados"); } }

/* Início: se já houver sessão salva, entra direto */
applyTheme();
if (user()) viewApp(); else viewLogin();
</script>
</body>
</html>
